name: Quality hooks

on: pull_request

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-quality.txt
      - run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Validate new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          message_file="$RUNNER_TEMP/printlab-commit-message.txt"
          while IFS= read -r revision; do
            git log -1 --format=%B "$revision" > "$message_file"
            python -m pre_commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename "$message_file"
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
