name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the coverage regression guard
        run: npm run test:coverage-guard
      - name: Run unit and frontend integration tests
        run: npm run test:ci -- --reporters=junit --reporters=default --output-file=tmp/unit-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-and-integration-results
          path: tmp/unit-results.xml
          retention-days: 14
      - name: Build the application
        run: npm run build
